<!DOCTYPE html>
<html>
<head>
  <title>Mini Games</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f4f4f4;
    }
    button {
      font-size: 24px;
      padding: 15px 30px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>Brain Break Clicker</h1>
<p>Score: <span id="score">0</span></p>
<button onclick="add()">Click!</button>

<script>
  let score = 0;
  function add() {
    score++;
    document.getElementById("score").innerText = score;
  }
</script>

</body>
</html>
