<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Bee Swarm Simulator</title>
<style>
    body { margin:0; overflow:hidden; background:#a0e0ff; font-family: Arial; }
    #scoreBoard { position:absolute; top:10px; left:10px; font-size:24px; background:rgba(255,255,255,0.7); padding:5px 10px; border-radius:5px; }
</style>
</head>
<body>
<div id="scoreBoard">Pollen: 0</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
let scene, camera, renderer;
let bee, beeSpeed = 0.5;
let flowers = [], items = [];
let score = 0;
const numFlowers = 10;

init();
animate();

function init() {
    // Scene
    scene = new THREE.Scene();

    // Camera
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0,5,10);
    camera.lookAt(0,0,0);

    // Renderer
    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Light
    const light = new THREE.DirectionalLight(0xffffff,1);
    light.position.set(5,10,5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff,0.5));

    // Ground
    const groundGeo = new THREE.PlaneGeometry(50,50);
    const groundMat = new THREE.MeshPhongMaterial({color:0x88cc44});
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI/2;
    scene.add(ground);

    // Bee (yellow sphere)
    const beeGeo = new THREE.SphereGeometry(0.5,16,16);
    const beeMat = new THREE.MeshPhongMaterial({color:0xffff00});
    bee = new THREE.Mesh(beeGeo, beeMat);
    bee.position.y = 0.5;
    scene.add(bee);

    // Flowers (red spheres)
    for(let i=0;i<numFlowers;i++){
        const flowerGeo = new THREE.SphereGeometry(0.3,16,16);
        const flowerMat = new THREE.MeshPhongMaterial({color: Math.random()>0.5?0xff00ff:0xff0000});
        const flower = new THREE.Mesh(flowerGeo, flowerMat);
        flower.position.set(Math.random()*20-10,0.3,Math.random()*20-10);
        scene.add(flower);
        flowers.push(flower);
    }

    // Keyboard controls
    document.addEventListener('keydown', e=>{
        keys[e.key.toLowerCase()] = true;
    });
    document.addEventListener('keyup', e=>{
        keys[e.key.toLowerCase()] = false;
    });
}

let keys = {};

function animate() {
    requestAnimationFrame(animate);

    // Bee movement
    if(keys['w']) bee.position.z -= beeSpeed;
    if(keys['s']) bee.position.z += beeSpeed;
    if(keys['a']) bee.position.x -= beeSpeed;
    if(keys['d']) bee.position.x += beeSpeed;

    // Keep bee above ground
    bee.position.y = 0.5;

    // Camera follows bee
    camera.position.x = bee.position.x + 0;
    camera.position.z = bee.position.z + 10;
    camera.position.y = bee.position.y + 5;
    camera.lookAt(bee.position);

    // Check collisions with flowers
    flowers.forEach(flower=>{
        const dist = bee.position.distanceTo(flower.position);
        if(dist<0.8){
            score += 1;
            document.getElementById('scoreBoard').innerText = 'Pollen: '+score;
            // Move flower to random spot
            flower.position.set(Math.random()*20-10,0.3,Math.random()*20-10);
        }
    });

    renderer.render(scene,camera);
}
</script>
</body>
</html>
