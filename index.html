<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Bee Swarm Prototype</title>
<style>
    body { margin:0; overflow:hidden; }
    #scoreBoard { position:absolute; top:10px; left:10px; font-size:24px; background:rgba(255,255,255,0.7); padding:5px 10px; border-radius:5px; }
</style>
</head>
<body>
<div id="scoreBoard">Pollen: 0</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.js"></script>
<script>
let scene, camera, renderer, controls;
let bee, beeSpeed = 0.5;
let flowers = [], bears = [];
let score = 0;
const numFlowers = 10, numBears = 2;
const keys = {};

init();
animate();

function init(){
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // sky blue

    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0,10,15);

    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enablePan = false;
    controls.target.set(0,0,0);

    // Light
    const light = new THREE.DirectionalLight(0xffffff,1);
    light.position.set(10,20,10);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff,0.5));

    // Ground
    const groundGeo = new THREE.PlaneGeometry(50,50);
    const groundMat = new THREE.MeshPhongMaterial({color:0x228B22});
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI/2;
    scene.add(ground);

    // Bee
    const beeGeo = new THREE.ConeGeometry(0.5,1,8);
    const beeMat = new THREE.MeshPhongMaterial({color:0xffff00});
    bee = new THREE.Mesh(beeGeo, beeMat);
    bee.rotation.x = Math.PI/2;
    bee.position.set(0,0.5,0);
    scene.add(bee);

    // Flowers
    for(let i=0;i<numFlowers;i++){
        const fGeo = new THREE.SphereGeometry(0.3,16,16);
        const fMat = new THREE.MeshPhongMaterial({color: Math.random()>0.5?0xff00ff:0xff0000});
        const f = new THREE.Mesh(fGeo, fMat);
        f.position.set(Math.random()*20-10,0.3,Math.random()*20-10);
        scene.add(f);
        flowers.push(f);
    }

    // Bears
    for(let i=0;i<numBears;i++){
        const bGeo = new THREE.BoxGeometry(1,1,1);
        const bMat = new THREE.MeshPhongMaterial({color:0x8B4513});
        const b = new THREE.Mesh(bGeo,bMat);
        b.position.set(Math.random()*20-10,0.5,Math.random()*20-10);
        scene.add(b);
        bears.push(b);
    }

    document.addEventListener('keydown', e=>keys[e.key.toLowerCase()]=true);
    document.addEventListener('keyup', e=>keys[e.key.toLowerCase()]=false);

    window.addEventListener('resize', ()=>{
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
}

function animate(){
    requestAnimationFrame(animate);

    // Move bee
    if(keys['w']) bee.position.z -= beeSpeed;
    if(keys['s']) bee.position.z += beeSpeed;
    if(keys['a']) bee.position.x -= beeSpeed;
    if(keys['d']) bee.position.x += beeSpeed;

    // Bears chase bee
    bears.forEach(b=>{
        const dx = bee.position.x - b.position.x;
        const dz = bee.position.z - b.position.z;
        const dist = Math.sqrt(dx*dx + dz*dz);
        if(dist>0){
            b.position.x += (dx/dist)*0.02;
            b.position.z += (dz/dist)*0.02;
        }
        if(dist < 1){
            score = Math.max(0,score-1);
        }
    });

    // Collect flowers
    flowers.forEach(f=>{
        const dx = bee.position.x - f.position.x;
        const dz = bee.position.z - f.position.z;
        const dist = Math.sqrt(dx*dx + dz*dz);
        if(dist < 1){
            score += 1;
            f.position.set(Math.random()*20-10,0.3,Math.random()*20-10);
        }
    });

    document.getElementById('scoreBoard').innerText = 'Pollen: '+score;

    // Camera follows bee
    controls.target.set(bee.position.x,bee.position.y,bee.position.z);
    controls.update();

    renderer.render(scene,camera);
}
</script>
</body>
</html>
