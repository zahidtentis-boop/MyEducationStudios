<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Game Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #ffcc00;
            padding: 20px;
        }

        header h1 {
            margin: 0;
            color: #333;
        }

        nav {
            margin: 20px 0;
        }

        nav button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: #ff9900;
            color: white;
            border-radius: 5px;
        }

        nav button:hover {
            background-color: #e68a00;
        }

        iframe {
            width: 80%;
            height: 600px;
            border: 2px solid #ccc;
            border-radius: 10px;
            margin-bottom: 40px;
        }

        .footer {
            padding: 20px;
            background-color: #ffcc00;
        }
    </style>
</head>
<body>

<header>
    <h1>School Game Hub</h1>
</header>

<nav>
    <button onclick="loadGame('bee')">Bee Swarm Simulator</button>
    <button onclick="loadGame('other')">Other Game</button>
</nav>

<div id="gameContainer">
    <iframe id="gameFrame" src="" allowfullscreen></iframe>
</div>

<div class="footer">
    &copy; 2026 Game Hub
</div>

<script>
    function loadGame(game) {
        const frame = document.getElementById('gameFrame');
        if (game === 'bee') {
            // Roblox Bee Swarm Simulator embed
            frame.src = 'https://www.roblox.com/games/1537690962/Bee-Swarm-Simulator'; 
        } else if (game === 'other') {
            // Example: another game URL
            frame.src = 'https://www.coolmathgames.com/0-fireboy-and-watergirl-1';
        }
    }
</script>

</body>
</html>
