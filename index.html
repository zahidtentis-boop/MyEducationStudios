<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Game Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #ffcc00;
            padding: 20px;
        }

        header h1 {
            margin: 0;
            color: #333;
        }

        nav {
            margin: 20px 0;
        }

        nav button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: #ff9900;
            color: white;
            border-radius: 5px;
        }

        nav button:hover {
            background-color: #e68a00;
        }

        iframe {
            width: 80%;
            height: 600px;
            border: 2px solid #ccc;
            border-radius: 10px;
            margin-bottom: 40px;
        }

        .footer {
            padding: 20px;
            background-color: #ffcc00;
        }
    </style>
</head>
<body>

<header>
    <h1>School Game Hub</h1>
</header>

<nav>
    <button onclick="loadGame('bee')">Bee Swarm Simulator</button>
    <button onclick="loadGame('other')">Other Game</button>
</nav>

<div id="gameContainer">
    <iframe id="gameFrame" src="" allowfullscreen></iframe>
</div>

<div class="footer">
    &copy; 2026 Game Hub
</div>

<script>
    function loadGame(game) {
        const frame = document.getElementById('gameFrame');
        if (game === 'bee') {
            // Roblox Bee Swarm Simulator embed
            frame.src = 'https://www.roblox.com/games/1537690962/Bee-Swarm-Simulator'; 
        } else if (game === 'other') {
            // Example: another game URL
            frame.src = 'https://www.coolmathgames.com/0-fireboy-and-watergirl-1';
        }
    }
</script>

</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Bee Swarm</title>
<style>
    body {
        background-color: #fef6e4;
        text-align: center;
        font-family: Arial, sans-serif;
    }
    canvas {
        border: 2px solid #ffcc00;
        background-color: #fff8dc;
        margin-top: 20px;
    }
    h1 {
        color: #ff9900;
    }
</style>
</head>
<body>

<h1>Mini Bee Swarm Simulator</h1>
<p>Use WASD keys to move your bee and collect flowers!</p>
<canvas id="gameCanvas" width="600" height="400"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let bee = { x: 300, y: 200, size: 20, color: 'yellow' };
let flowers = [];
let score = 0;

// Create random flowers
for(let i=0; i<10; i++){
    flowers.push({
        x: Math.random() * (canvas.width - 20),
        y: Math.random() * (canvas.height - 20),
        size: 15,
        color: 'pink'
    });
}

// Keyboard controls
let keys = {};
document.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function update() {
    if(keys['w']) bee.y -= 5;
    if(keys['s']) bee.y += 5;
    if(keys['a']) bee.x -= 5;
    if(keys['d']) bee.x += 5;

    // Keep bee inside canvas
    bee.x = Math.max(0, Math.min(canvas.width - bee.size, bee.x));
    bee.y = Math.max(0, Math.min(canvas.height - bee.size, bee.y));

    // Check collisions with flowers
    flowers.forEach((flower, i) => {
        const dx = bee.x - flower.x;
        const dy = bee.y - flower.y;
        const distance = Math.sqrt(dx*dx + dy*dy);
        if(distance < (bee.size + flower.size)/2) {
            score += 1;
            // Move flower to new random position
            flower.x = Math.random() * (canvas.width - flower.size);
            flower.y = Math.random() * (canvas.height - flower.size);
        }
    });
}

function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Draw bee
    ctx.fillStyle = bee.color;
    ctx.beginPath();
    ctx.arc(bee.x, bee.y, bee.size, 0, Math.PI*2);
    ctx.fill();

    // Draw flowers
    flowers.forEach(f => {
        ctx.fillStyle = f.color;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.size, 0, Math.PI*2);
        ctx.fill();
    });

    // Draw score
    ctx.fillStyle = '#333';
    ctx.font = '20px Arial';
    ctx.fillText('Pollen collected: ' + score, 10, 30);
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
