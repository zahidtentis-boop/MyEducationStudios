<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Bee Swarm Simulator</title>
<style>
    body { margin:0; overflow:hidden; background:#87ceeb; font-family:Arial; }
    #scoreBoard { position:absolute; top:10px; left:10px; font-size:24px; background:rgba(255,255,255,0.7); padding:5px 10px; border-radius:5px; }
</style>
</head>
<body>
<div id="scoreBoard">Pollen: 0</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.js"></script>

<script>
let scene, camera, renderer, controls;
let bee, beeSpeed = 0.2;
let flowers = [], score = 0;
const numFlowers = 15;
const keys = {};

init();
animate();

function init() {
    // Scene
    scene = new THREE.Scene();

    // Camera
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0,5,10);

    // Renderer
    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Controls
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enablePan = false;
    controls.enableZoom = true;
    controls.target.set(0,0.5,0);

    // Light
    const light = new THREE.DirectionalLight(0xffffff,1);
    light.position.set(10,20,10);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff,0.5));

    // Ground
    const groundGeo = new THREE.PlaneGeometry(50,50);
    const groundMat = new THREE.MeshPhongMaterial({color:0x228B22});
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI/2;
    scene.add(ground);

    // Bee (cone)
    const beeGeo = new THREE.ConeGeometry(0.3,0.8,8);
    const beeMat = new THREE.MeshPhongMaterial({color:0xffff00});
    bee = new THREE.Mesh(beeGeo, beeMat);
    bee.rotation.x = Math.PI/2; // point forward
    bee.position.set(0,0.5,0);
    scene.add(bee);

    // Flowers (cylinders)
    for(let i=0;i<numFlowers;i++){
        const flowerGeo = new THREE.CylinderGeometry(0.2,0.2,0.5,12);
        const flowerMat = new THREE.MeshPhongMaterial({color: Math.random()>0.5?0xff00ff:0xff0000});
        const flower = new THREE.Mesh(flowerGeo, flowerMat);
        flower.position.set(Math.random()*20-10,0.25,Math.random()*20-10);
        scene.add(flower);
        flowers.push(flower);
    }

    // Keyboard events
    document.addEventListener('keydown', e=>keys[e.key.toLowerCase()]=true);
    document.addEventListener('keyup', e=>keys[e.key.toLowerCase()]=false);

    window.addEventListener('resize', onWindowResize, false);
}

function onWindowResize(){
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate(){
    requestAnimationFrame(animate);

    // Bee movement
    if(keys['w']) bee.position.z -= beeSpeed;
    if(keys['s']) bee.position.z += beeSpeed;
    if(keys['a']) bee.position.x -= beeSpeed;
    if(keys['d']) bee.position.x += beeSpeed;

    bee.position.y = 0.5; // stay above ground

    // Camera follows bee
    controls.target.set(bee.position.x,bee.position.y,bee.position.z);
    controls.update();

    // Check flower collision
    flowers.forEach(flower=>{
        const dist = bee.position.distanceTo(flower.position);
        if(dist<0.5){
            score +=1;
            document.getElementById('scoreBoard').innerText = 'Pollen: '+score;
            flower.position.set(Math.random()*20-10,0.25,Math.random()*20-10);
        }
    });

    renderer.render(scene,camera);
}
</script>
</body>
</html>
