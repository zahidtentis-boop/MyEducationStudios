<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bee Swarm Simulator (Pseudo 3D)</title>
<style>
    body { margin:0; background:#87ceeb; overflow:hidden; font-family:Arial; }
    #scoreBoard { position:absolute; top:10px; left:10px; font-size:24px; background:rgba(255,255,255,0.7); padding:5px 10px; border-radius:5px; }
</style>
</head>
<body>
<div id="scoreBoard">Pollen: 0</div>
<canvas id="gameCanvas"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let bee = { x: canvas.width/2, y: canvas.height/2, size: 20 };
let flowers = [];
let score = 0;
const numFlowers = 15;
const keys = {};

// Generate flowers
for(let i=0;i<numFlowers;i++){
    flowers.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        size: 20,
        color: Math.random()>0.5?'red':'pink'
    });
}

// Keyboard controls
document.addEventListener('keydown', e=>keys[e.key.toLowerCase()]=true);
document.addEventListener('keyup', e=>keys[e.key.toLowerCase()]=false);

function update(){
    if(keys['w']) bee.y -= 5;
    if(keys['s']) bee.y += 5;
    if(keys['a']) bee.x -= 5;
    if(keys['d']) bee.x += 5;

    // Keep bee on screen
    bee.x = Math.max(0, Math.min(canvas.width, bee.x));
    bee.y = Math.max(0, Math.min(canvas.height, bee.y));

    // Check collisions
    flowers.forEach(f=>{
        const dx = bee.x - f.x;
        const dy = bee.y - f.y;
        if(Math.sqrt(dx*dx+dy*dy)<bee.size){
            score++;
            document.getElementById('scoreBoard').innerText = 'Pollen: '+score;
            f.x = Math.random()*canvas.width;
            f.y = Math.random()*canvas.height;
        }
    });
}

function draw(){
    // Clear background
    ctx.fillStyle = '#228B22'; // green field
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // Draw flowers
    flowers.forEach(f=>{
        ctx.fillStyle = f.color;
        ctx.beginPath();
        ctx.arc(f.x,f.y,f.size/2,0,Math.PI*2);
        ctx.fill();
    });

    // Draw bee
    ctx.fillStyle = 'yellow';
    ctx.beginPath();
    ctx.arc(bee.x,bee.y,bee.size/2,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = 'black';
    ctx.stroke();
}

function gameLoop(){
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
