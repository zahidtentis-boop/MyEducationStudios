<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Game Hub</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        text-align: center;
        margin: 0;
        padding: 0;
    }

    header {
        background-color: #ffcc00;
        padding: 20px;
    }

    header h1 {
        margin: 0;
        color: #333;
    }

    nav {
        margin: 20px 0;
    }

    nav button {
        padding: 10px 20px;
        margin: 5px;
        font-size: 16px;
        cursor: pointer;
        border: none;
        background-color: #ff9900;
        color: white;
        border-radius: 5px;
    }

    nav button:hover {
        background-color: #e68a00;
    }

    #gameContainer {
        margin: 20px auto;
        width: 620px;
        height: 440px;
        border: 2px solid #ccc;
        border-radius: 10px;
        background-color: #fff8dc;
    }

    canvas {
        display: block;
        margin: auto;
        background-color: #fff8dc;
    }

    .footer {
        padding: 20px;
        background-color: #ffcc00;
        margin-top: 20px;
    }
</style>
</head>
<body>

<header>
    <h1>School Game Hub</h1>
</header>

<nav>
    <button onclick="loadGame('bee')">Bee Swarm Simulator</button>
    <button onclick="loadGame('other')">Other Game</button>
</nav>

<div id="gameContainer">
    <p style="padding-top: 180px;">Click a button above to play a game!</p>
</div>

<div class="footer">
    &copy; 2026 Game Hub
</div>

<script>
const gameContainer = document.getElementById('gameContainer');

function loadGame(game) {
    gameContainer.innerHTML = ''; // Clear previous content
    if(game === 'bee') {
        // Create canvas for Bee Swarm
        const canvas = document.createElement('canvas');
        canvas.width = 600;
        canvas.height = 400;
        gameContainer.appendChild(canvas);
        startBeeSwarm(canvas);
    } else if(game === 'other') {
        gameContainer.innerHTML = '<p>Other game coming soon!</p>';
    }
}

// Mini Bee Swarm Simulator
function startBeeSwarm(canvas) {
    const ctx = canvas.getContext('2d');
    let bee = { x: 300, y: 200, size: 20, color: 'yellow' };
    let flowers = [];
    let score = 0;

    for(let i=0; i<10; i++){
        flowers.push({
            x: Math.random() * (canvas.width - 20),
            y: Math.random() * (canvas.height - 20),
            size: 15,
            color: 'pink'
        });
    }

    let keys = {};
    document.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    function update() {
        if(keys['w']) bee.y -= 5;
        if(keys['s']) bee.y += 5;
        if(keys['a']) bee.x -= 5;
        if(keys['d']) bee.x += 5;

        bee.x = Math.max(0, Math.min(canvas.width - bee.size, bee.x));
        bee.y = Math.max(0, Math.min(canvas.height - bee.size, bee.y));

        flowers.forEach(flower => {
            const dx = bee.x - flower.x;
            const dy = bee.y - flower.y;
            const distance = Math.sqrt(dx*dx + dy*dy);
            if(distance < (bee.size + flower.size)/2) {
                score += 1;
                flower.x = Math.random() * (canvas.width - flower.size);
                flower.y = Math.random() * (canvas.height - flower.size);
            }
        });
    }

    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);

        // Draw bee
        ctx.fillStyle = bee.color;
        ctx.beginPath();
        ctx.arc(bee.x, bee.y, bee.size, 0, Math.PI*2);
        ctx.fill();

        // Draw flowers
        flowers.forEach(f => {
            ctx.fillStyle = f.color;
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.size, 0, Math.PI*2);
            ctx.fill();
        });

        // Draw score
        ctx.fillStyle = '#333';
        ctx.font = '20px Arial';
        ctx.fillText('Pollen collected: ' + score, 10, 30);
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    gameLoop();
}
</script>

</body>
</html>
