<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Game Hub</title>
<style>
    body { font-family: Arial; text-align:center; margin:0; padding:0; background:#f5f5f5; }
    header { background:#ffcc00; padding:20px; }
    header h1 { margin:0; color:#333; }
    nav { margin:20px 0; }
    nav button { padding:10px 20px; margin:5px; font-size:16px; cursor:pointer; border:none; background:#ff9900; color:white; border-radius:5px; }
    nav button:hover { background:#e68a00; }
    #gameContainer { margin:20px auto; width:620px; height:440px; border:2px solid #ccc; border-radius:10px; background:#fff8dc; position:relative; }
    canvas { display:block; margin:auto; background:#fff8dc; }
    #scoreBoard { position:absolute; top:10px; left:10px; font-size:18px; color:#333; background:rgba(255,255,255,0.7); padding:5px 10px; border-radius:5px; }
</style>
</head>
<body>

<header>
    <h1>School Game Hub</h1>
</header>

<nav>
    <button onclick="loadBeeSwarm()">Bee Swarm Simulator</button>
    <button onclick="loadOther()">Other Game</button>
</nav>

<div id="gameContainer">
    <p style="padding-top:180px;">Click a button above to play a game!</p>
</div>

<script>
const gameContainer = document.getElementById('gameContainer');
let beeSwarmLoaded = false; // Flag to ensure only one screen

function loadBeeSwarm() {
    if(beeSwarmLoaded) return; // If already loaded, do nothing
    beeSwarmLoaded = true;

    gameContainer.innerHTML = ''; // Clear placeholder
    const canvas = document.createElement('canvas');
    canvas.width = 600;
    canvas.height = 400;
    gameContainer.appendChild(canvas);

    const scoreBoard = document.createElement('div');
    scoreBoard.id = 'scoreBoard';
    scoreBoard.innerText = 'Pollen: 0';
    gameContainer.appendChild(scoreBoard);

    startBeeSwarm(canvas, scoreBoard);
}

function loadOther() {
    gameContainer.innerHTML = '<p>Other game coming soon!</p>';
}

// Bee Swarm Simulator
function startBeeSwarm(canvas, scoreBoard) {
    const ctx = canvas.getContext('2d');

    let bee = { x: 300, y: 200, size: 15, color: 'yellow', speed: 5 };
    const flowerTypes = [{ color:'pink', points:1 }, { color:'red', points:2 }, { color:'blue', points:3 }];
    let flowers = [];
    for(let i=0;i<10;i++){
        let type = flowerTypes[Math.floor(Math.random()*flowerTypes.length)];
        flowers.push({ x: Math.random()*(canvas.width-20), y: Math.random()*(canvas.height-20), size:15, color:type.color, points:type.points });
    }
    let items = [];
    let score = 0;
    let keys = {};

    document.addEventListener('keydown', e => keys[e.key.toLowerCase()]=true);
    document.addEventListener('keyup', e => keys[e.key.toLowerCase()]=false);

    function spawnItem() {
        items.push({ x: Math.random()*(canvas.width-20), y: Math.random()*(canvas.height-20), size:10, color:'orange', points:5 });
    }
    setInterval(spawnItem,10000);

    function update() {
        if(keys['w']) bee.y -= bee.speed;
        if(keys['s']) bee.y += bee.speed;
        if(keys['a']) bee.x -= bee.speed;
        if(keys['d']) bee.x += bee.speed;

        bee.x = Math.max(0, Math.min(canvas.width-bee.size, bee.x));
        bee.y = Math.max(0, Math.min(canvas.height-bee.size, bee.y));

        flowers.forEach(f=>{
            const dx=bee.x-f.x, dy=bee.y-f.y;
            if(Math.sqrt(dx*dx+dy*dy)<(bee.size+f.size)/2){
                score+=f.points;
                f.x=Math.random()*(canvas.width-20);
                f.y=Math.random()*(canvas.height-20);
                let type=flowerTypes[Math.floor(Math.random()*flowerTypes.length)];
                f.color=type.color; f.points=type.points;
            }
        });

        items.forEach((item,i)=>{
            const dx=bee.x-item.x, dy=bee.y-item.y;
            if(Math.sqrt(dx*dx+dy*dy)<(bee.size+item.size)/2){
                score+=item.points;
                items.splice(i,1);
            }
        });

        scoreBoard.innerText='Pollen: '+score;
    }

    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        flowers.forEach(f=>{
            ctx.fillStyle=f.color;
            ctx.beginPath(); ctx.arc(f.x,f.y,f.size,0,Math.PI*2); ctx.fill();
        });
        items.forEach(item=>{
            ctx.fillStyle=item.color;
            ctx.beginPath(); ctx.arc(item.x,item.y,item.size,0,Math.PI*2); ctx.fill();
        });
        ctx.fillStyle=bee.color;
        ctx.beginPath(); ctx.arc(bee.x,bee.y,bee.size,0,Math.PI*2); ctx.fill();
    }

    function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
    gameLoop();
}
</script>

</body>
</html>
