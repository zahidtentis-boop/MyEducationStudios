<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Bee Swarm with Hive</title>
<style>
body { margin:0; overflow:hidden; font-family:sans-serif; }
canvas { display:block; }

#inventoryBox, #itemsBox, #questBox, #shopBox {
  position:absolute; padding:10px; background:rgba(255,255,255,0.85); border:2px solid #000;
}
#inventoryBox { top:10px; right:10px; }
#itemsBox { top:10px; left:10px; width:160px; }
#questBox { top:200px; left:10px; display:none; }
#shopBox { top:300px; left:10px; display:none; }
#shopBox button { margin-top:5px; padding:5px; }
.item { cursor:pointer; margin:3px 0; padding:2px; border:1px solid #666; text-align:center; }
</style>
</head>
<body>

<!-- Inventory UI -->
<div id="itemsBox">
  <h3>Items</h3>
  <div id="inventoryItems"></div>
  <p>Press <strong>Q</strong> to pick up egg</p>
</div>

<div id="questBox"></div>

<div id="shopBox">
  <h3>Shop</h3>
  <div>Pollen in inventory: <span id="shopPollen">0</span></div>
  <button onclick="buyGear('speed')">Buy Speed Boost (10 Pollen)</button><br>
  <button onclick="buyGear('autoPollen')">Buy Auto Pollen (15 Pollen)</button>
  <button onclick="closeShop()">Close Shop</button>
</div>

<div id="inventoryBox">
  Inventory: <span id="inventory">0</span> | Hive: <span id="hivePollen">0</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>

/* ====== THREE.JS SETUP ====== */
let scene = new THREE.Scene();
scene.background = new THREE.Color(0xa0d0ff);
let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,20,20);
camera.lookAt(0,0,0);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

let light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(10,20,10);
scene.add(light);
scene.add(new THREE.AmbientLight(0x404040));

/* ====== GROUND ====== */
let ground = new THREE.Mesh(
  new THREE.PlaneGeometry(50,50),
  new THREE.MeshStandardMaterial({color:0x88cc88})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

/* ====== PLAYER ====== */
let player = new THREE.Group();
let head = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshStandardMaterial({color:0xffcc99}));
head.position.y = 2.5; player.add(head);
let body = new THREE.Mesh(new THREE.BoxGeometry(1,1.5,0.5), new THREE.MeshStandardMaterial({color:0x0000ff}));
body.position.y = 1.25; player.add(body);
let hair = new THREE.Mesh(new THREE.BoxGeometry(1.1,0.4,1.1), new THREE.MeshStandardMaterial({color:0xff6633}));
hair.position.y = 3; player.add(hair);
scene.add(player);

/* ====== HIVE ====== */
let hive = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({color:0xffff00}));
hive.position.set(-15,1,0);
scene.add(hive);
const hiveSlotPosition = new THREE.Vector3(hive.position.x, hive.position.y + 1, hive.position.z);
const hiveSlotRadius = 1.5;

/* ====== FLOWERS ====== */
let flowers = [];
for(let i=0;i<10;i++){
  let f = new THREE.Mesh(new THREE.SphereGeometry(0.5,16,16), new THREE.MeshStandardMaterial({color:0xff88cc}));
  f.position.set(Math.random()*20-10,0.5,Math.random()*20-10);
  scene.add(f);
  flowers.push(f);
}

/* ====== BEARS & QUESTS ====== */
let bears = [], quests = [];
for(let i=0;i<3;i++){
  let b = new THREE.Mesh(new THREE.BoxGeometry(1,1.5,1), new THREE.MeshStandardMaterial({color:0x885522}));
  b.position.set(Math.random()*20-10,0.75,Math.random()*20-10);
  scene.add(b); bears.push(b);
  quests.push({bearIndex:i,target:5+i*5,completed:false});
}

/* ====== PLAYER STATS ====== */
let inventory = 0, hivePollen = 0, speed = 0.2, autoPollen = 0;
let keys = {};
document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

/* ====== UI ELEMENTS ====== */
const questBox = document.getElementById("questBox");
const shopBox = document.getElementById("shopBox");
const inventoryBox = document.getElementById("inventoryBox");

/* ====== SHOP ====== */
function openShop(){ 
  shopBox.style.display="block"; 
  document.getElementById("shopPollen").innerText = inventory; 
}
function closeShop(){ shopBox.style.display="none"; }
function buyGear(type){
  if(type==='speed' && inventory>=10){ speed+=0.1; inventory-=10; }
  else if(type==='autoPollen' && inventory>=15){ autoPollen+=1; inventory-=15; }
  else{ alert("Not enough pollen!"); }
  document.getElementById("shopPollen").innerText = inventory;
}

/* ====== BEES & ITEMS ====== */
let bees = [];
let itemsInventory = ["Basic Egg"];
const inventoryItemsDiv = document.getElementById("inventoryItems");
let carriedEgg = null;

// Reset Items UI
function resetItems(){
  inventoryItemsDiv.innerHTML = '';
  itemsInventory.forEach(i=>{
    if(i==="Basic Egg"){
      let egg = document.createElement("div");
      egg.className = "item";
      egg.innerText = "🟡 Basic Egg";
      inventoryItemsDiv.appendChild(egg);
    }
  });
}
resetItems();

// Pick up egg
document.addEventListener("keydown", e=>{
  if(e.key.toLowerCase() === "q" && itemsInventory.includes("Basic Egg") && !carriedEgg){
    itemsInventory = itemsInventory.filter(x=>x!=="Basic Egg");
    resetItems();

    // Create 3D egg above player
    carriedEgg = new THREE.Mesh(
      new THREE.SphereGeometry(0.3,8,8),
      new THREE.MeshStandardMaterial({color:0xffff00})
    );
    carriedEgg.position.set(player.position.x, player.position.y + 2, player.position.z);
    scene.add(carriedEgg);
  }
});

// Spawn Bee
function spawnBee(){
  let bee = new THREE.Mesh(
    new THREE.SphereGeometry(0.2,8,8),
    new THREE.MeshStandardMaterial({color:0xffff00})
  );
  bee.position.set(player.position.x + Math.random()*2-1, 1, player.position.z + Math.random()*2-1);
  bee.targetFlower = null;
  scene.add(bee);
  bees.push(bee);
}

// Nearest flower
function getNearestFlower(bee){
  let nearest=null, minDist=Infinity;
  flowers.forEach(f=>{
    let d=bee.position.distanceTo(f.position);
    if(d<minDist){ minDist=d; nearest=f; }
  });
  return nearest;
}

// Update bees
function updateBees(){
  bees.forEach((bee,i)=>{
    if(!bee.targetFlower) bee.targetFlower = getNearestFlower(bee);
    if(bee.targetFlower){
      let dir = new THREE.Vector3().subVectors(bee.targetFlower.position,bee.position);
      if(dir.length()>0.1){ dir.normalize(); bee.position.add(dir.multiplyScalar(0.1)); }
      else{
        inventory+=1;
        bee.targetFlower.position.set(Math.random()*20-10,0.5,Math.random()*20-10);
        bee.targetFlower = null;
      }
      bee.position.y = 1+Math.sin(Date.now()/200+i)*0.2;
    }
  });
}

// Update carried egg
function updateCarriedEgg(){
  if(carriedEgg){
    carriedEgg.position.set(player.position.x, player.position.y + 2, player.position.z);
    if(carriedEgg.position.distanceTo(hiveSlotPosition) < hiveSlotRadius){
      spawnBee();
      scene.remove(carriedEgg);
      carriedEgg = null;
      console.log("Egg hatched at hive!");
    }
  }
}

/* ====== ANIMATE LOOP ====== */
function animate(){
  requestAnimationFrame(animate);

  // Movement
  if(keys['w']) player.position.z -= speed;
  if(keys['s']) player.position.z += speed;
  if(keys['a']) player.position.x -= speed;
  if(keys['d']) player.position.x += speed;

  // Collect flowers
  flowers.forEach(f=>{
    if(player.position.distanceTo(f.position)<1){
      inventory++;
      f.position.set(Math.random()*20-10,0.5,Math.random()*20-10);
    }
  });

  // Bears quests
  bears.forEach((b,i)=>{
    if(player.position.distanceTo(b.position)<1.5 && !quests[i].completed){
      questBox.style.display="block";
      questBox.innerHTML = `Bear ${i+1} Quest: Collect ${quests[i].target} pollen. Inventory: ${inventory} <br> Press 'E' for shop`;
    }
  });

  if(keys['e']) openShop();

  // Complete quests
  quests.forEach(q=>{
    if(!q.completed && inventory>=q.target){
      inventory-=q.target; hivePollen+=q.target; q.completed=true;
      questBox.innerHTML = `Quest complete! Deposited ${q.target} pollen to hive.`;
      setTimeout(()=>{ questBox.style.display="none"; },2000);
    }
  });

  // Auto pollen
  inventory+=autoPollen*0.01;

  // Deposit at hive
  if(player.position.distanceTo(hive.position)<2 && inventory>0){
    hivePollen+=inventory; inventory=0;
  }

  // Update bees
  updateBees();

  // Update egg
  updateCarriedEgg();

  // Camera
  camera.position.x = player.position.x+10;
  camera.position.z = player.position.z+10;
  camera.lookAt(player.position);

  renderer.render(scene,camera);

  // UI
  document.getElementById("inventory").innerText = Math.floor(inventory);
  document.getElementById("hivePollen").innerText = Math.floor(hivePollen);
}

animate();

</script>
</body>
</html>
