<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Mini Bee Swarm</title>
<style>
  body { margin: 0; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
let scene = new THREE.Scene();
scene.background = new THREE.Color(0xa0d0ff);

let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 20, 20);
camera.lookAt(0,0,0);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Light
let light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(10,20,10);
scene.add(light);

// Ground
let groundGeo = new THREE.PlaneGeometry(50,50);
let groundMat = new THREE.MeshStandardMaterial({color:0x88cc88});
let ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// Player
let playerGeo = new THREE.BoxGeometry(1,1,1);
let playerMat = new THREE.MeshStandardMaterial({color:0xffff00});
let player = new THREE.Mesh(playerGeo, playerMat);
player.position.y = 0.5;
scene.add(player);

// Flowers
let flowers = [];
for(let i=0;i<10;i++){
  let fGeo = new THREE.SphereGeometry(0.5, 16,16);
  let fMat = new THREE.MeshStandardMaterial({color:0xff88cc});
  let f = new THREE.Mesh(fGeo, fMat);
  f.position.set(Math.random()*20-10,0.5,Math.random()*20-10);
  scene.add(f);
  flowers.push(f);
}

let pollen = 0;
let keys = {};

// Controls
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

function animate(){
  requestAnimationFrame(animate);

  // Player movement
  if(keys["ArrowUp"]) player.position.z -= 0.2;
  if(keys["ArrowDown"]) player.position.z += 0.2;
  if(keys["ArrowLeft"]) player.position.x -= 0.2;
  if(keys["ArrowRight"]) player.position.x += 0.2;

  // Check collision with flowers
  flowers.forEach(f=>{
    if(player.position.distanceTo(f.position) < 1){
      pollen++;
      f.position.set(Math.random()*20-10,0.5,Math.random()*20-10);
    }
  });

  // Update camera to follow player
  camera.position.x = player.position.x + 10;
  camera.position.z = player.position.z + 10;
  camera.lookAt(player.position);

  renderer.render(scene, camera);

  // Display pollen
  document.getElementById("pollen")?.remove();
  let div = document.createElement("div");
  div.id = "pollen";
  div.style.position = "absolute";
  div.style.top = "10px";
  div.style.left = "10px";
  div.style.color = "black";
  div.style.fontSize = "20px";
  div.style.fontFamily = "sans-serif";
  div.innerHTML = "Pollen: " + pollen;
  document.body.appendChild(div);
}

animate();
</script>
</body>
</html>
